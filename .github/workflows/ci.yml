name: CI

on:
  push:
    branches: [main]
  pull_request:

# The family's concurrency-cancel block lives in the reusable workflow
# (johnhenry/workflows ci.yml@v1, group ci-<workflow>-<ref>). Don't repeat it
# here: the same group at both levels is rejected as a deadlock before the
# run starts.

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      # npm test: syntax, references, lint, and types.
      # Then the browser suites: Chromium, Firefox, WebKit, and Chromium with HTML-in-canvas on.
      gate-commands: |
        npm test
        npx playwright install --with-deps chromium firefox webkit
        npm run test:browser
      # custom-elements.json and everything generated from it must be
      # committed up to date (`npm run manifest`).
      drift-check: true
      drift-build-command: npm run manifest
      drift-path: custom-elements.json vscode.html-custom-data.json docs/reference.md src

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
