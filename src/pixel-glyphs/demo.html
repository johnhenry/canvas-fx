<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pixel-glyphs</title>
<script type="module" src="../global.mjs"></script>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; background: #111; color: #ddd; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: start; }
  figure { margin: 0; inline-size: 320px; }
  pixel-canvas { inline-size: 320px; }
  figcaption code { font-size: 12px; color: #9cf; }
  button { font: inherit; }
  pre { font: 10px/1 ui-monospace, monospace; color: #9f9; background: #000; padding: 8px; overflow: auto; max-inline-size: 100%; }
  .card { background: #e8f0ff; color: #123; padding: 14px; margin: 0; }
  .card h3 { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="row">
  <figure>
    <pixel-canvas id="color" width="320" gpu effects="adjust(contrast 1.3) glyphs(6x10)">
      <img src="../pixel-canvas/scene.svg" alt="A sunset, in colored characters" />
    </pixel-canvas>
    <figcaption><code>glyphs(6x10)</code>: each cell's own color</figcaption>
  </figure>
  <figure>
    <pixel-canvas width="320" gpu effects="glyphs(6x10, ramp, monospace, brightness, #33ff66, #001a08) crt(0.4)">
      <img src="../pixel-canvas/scene.svg" alt="A sunset, on a green terminal" />
    </pixel-canvas>
    <figcaption><code>glyphs(…, #33ff66, #001a08) crt()</code>: a terminal</figcaption>
  </figure>
  <figure>
    <pixel-canvas width="320" effects="outline(0.15, white, black) glyphs(8x12, ascii, monospace, shape, white)">
      <img src="../pixel-canvas/scene.svg" alt="A sunset, as line art in characters" />
    </pixel-canvas>
    <figcaption><code>outline() glyphs(…, shape)</code>: lines get <code>/ \ | - _</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas html effects="glyphs(5x8, ramp, monospace, brightness, #123, #e8f0ff)">
      <form class="card" onsubmit="event.preventDefault()">
        <h3>Live HTML, as text</h3>
        <label>Name <input value="Ada"></label> <button>Sign</button>
      </form>
    </pixel-canvas>
    <figcaption><code>html</code> + <code>glyphs()</code> (needs HTML-in-canvas)</figcaption>
  </figure>
</div>
<p><button type="button" id="text">toText() the first one</button></p>
<pre id="out" aria-label="The first image as text"></pre>
<script type="module">
  document.getElementById("text").onclick = async () => {
    document.getElementById("out").textContent = await document.getElementById("color").toText();
  };
</script>
</body>
</html>
