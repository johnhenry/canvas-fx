<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pixel-canvas</title>
<script type="module" src="../global.mjs"></script>
<script type="module">
  import { definePixelEffect } from "../effects.mjs";
  // A custom effect, no class needed: invert(). Also usable as <pixel-invert>.
  definePixelEffect("invert", (image) => {
    for (let i = 0; i < image.data.length; i += 4) {
      image.data[i] = 255 - image.data[i];
      image.data[i + 1] = 255 - image.data[i + 1];
      image.data[i + 2] = 255 - image.data[i + 2];
    }
    return image;
  });
</script>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  figure { margin: 0; }
  pixel-canvas, figure > img { inline-size: 240px; }
  figcaption code { font-size: 12px; }
  button, label { font: inherit; }
</style>
</head>
<body>
<div class="row">
  <figure>
    <img src="scene.svg" alt="A sunset over hills" />
    <figcaption>The source</figcaption>
  </figure>
  <figure>
    <pixel-canvas width="80"><img src="scene.svg" alt="A sunset over hills, pixelated" /></pixel-canvas>
    <figcaption><code>width="80"</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="160" effects="palette(gameboy, ordered)"><img src="scene.svg" alt="A sunset, Game Boy style" /></pixel-canvas>
    <figcaption><code>palette(gameboy, ordered)</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="240" effects="adjust(contrast 1.3) palette(1bit, floyd-steinberg)"><img src="scene.svg" alt="A sunset in black and white" /></pixel-canvas>
    <figcaption><code>adjust(contrast 1.3) palette(1bit, floyd-steinberg)</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="240" effects="mosaic(8) palette(pico-8) grid(8, rgb(0 0 0 / 0.5))"><img src="scene.svg" alt="A sunset as a mosaic of tiles" /></pixel-canvas>
    <figcaption><code>mosaic(8) palette(pico-8) grid(8, …)</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="240" effects="halftone(5)"><img src="scene.svg" alt="A sunset as halftone dots" /></pixel-canvas>
    <figcaption><code>halftone(5)</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="240" effects="halftone(6, 30, auto)"><img src="scene.svg" alt="A sunset as colored dots" /></pixel-canvas>
    <figcaption><code>halftone(6, 30, auto)</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="240" effects="outline(0.08)"><img src="scene.svg" alt="A sunset as line art" /></pixel-canvas>
    <figcaption><code>outline(0.08)</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="120" effects="palette(cga) crt()"><img src="scene.svg" alt="A sunset on an old screen" /></pixel-canvas>
    <figcaption><code>palette(cga) crt()</code></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="240" effects="chroma-key(#1e3c72, 0.08, 0.05)" style="background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px"><img src="scene.svg" alt="A sunset with the sky keyed out" /></pixel-canvas>
    <figcaption><code>chroma-key(#1e3c72, …)</code> over a CSS background</figcaption>
  </figure>
  <figure>
    <pixel-canvas id="toggled" width="160">
      <pixel-invert id="invert" disabled>
        <pixel-palette colors="sepia" dither="ordered">
          <img src="scene.svg" alt="A sunset in sepia" />
        </pixel-palette>
      </pixel-invert>
    </pixel-canvas>
    <figcaption>
      As elements, with a custom <code>&lt;pixel-invert&gt;</code>:
      <label><input type="checkbox" id="invert-on" /> invert</label>
      <button id="save">Download PNG</button>
    </figcaption>
  </figure>
</div>

<h2>Over time</h2>
<div class="row">
  <figure>
    <pixel-canvas id="glitchy" width="160" fps="12" effects="glitch(0.5)"><img src="scene.svg" alt="A sunset, glitching" /></pixel-canvas>
    <figcaption><code>fps="12" effects="glitch(0.5)"</code> <button commandfor="glitchy" command="--toggle">Play/pause</button></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="160" fps="30" effects="wave(3, 20, 0.6) palette(pico-8)"><img src="scene.svg" alt="A sunset, rippling" /></pixel-canvas>
    <figcaption><code>wave(3, 20, 0.6) palette(pico-8)</code></figcaption>
  </figure>
</div>

<h2>Sprites</h2>
<div class="row">
  <figure>
    <pixel-sprite alt="A heart" style="--domkit-sprite-scale: 12">
      .8.8.
      88888
      88888
      .888.
      ..8..
    </pixel-sprite>
    <figcaption>PICO-8 digits</figcaption>
  </figure>
  <figure>
    <pixel-sprite id="coin" colors=". transparent; # #5f3c14; o #ffcf40; w #fff6c0" fps="8" alt="A spinning coin" style="--domkit-sprite-scale: 10">
      ..####..
      .#oooo#.
      #owoooo#
      #owoooo#
      #oooooo#
      .#oooo#.
      ..####..

      ...##...
      ..#oo#..
      .#owoo#.
      .#owoo#.
      .#oooo#.
      ..#oo#..
      ...##...

      ...##...
      ...#o#..
      ...#w#..
      ...#w#..
      ...#o#..
      ...#o#..
      ...##...

      ...##...
      ..#oo#..
      .#oowo#.
      .#oowo#.
      .#oooo#.
      ..#oo#..
      ...##...
    </pixel-sprite>
    <figcaption><code>fps="8"</code> <button commandfor="coin" command="--toggle">Play/pause</button></figcaption>
  </figure>
  <figure>
    <pixel-canvas width="128" effects="crt(0.4, 0.3)" style="inline-size: 192px">
      <pixel-sprite colors="gameboy" fps="4" alt="A blinking face, on an old screen">
        33333333
        32222223
        32022023
        32222223
        32022023
        32200223
        32222223
        33333333

        33333333
        32222223
        32222223
        32000023
        32222223
        32200223
        32222223
        33333333
      </pixel-sprite>
    </pixel-canvas>
    <figcaption>A sprite through <code>crt()</code></figcaption>
  </figure>
</div>

<h2>Colors from the image</h2>
<div class="row">
  <figure id="themed" style="padding: 12px; border-radius: 8px; background: var(--pixel-swatch-1, #eee); color: white; border: 6px solid var(--pixel-swatch-3, #ccc)">
    <pixel-canvas id="swatched" width="120" swatches="4" swatches-target="#themed" effects="palette(auto, ordered, 6)"><img src="scene.svg" alt="A sunset in its own six colors" /></pixel-canvas>
    <figcaption><code>palette(auto, ordered, 6)</code>, and this card's colors come from <code>swatches="4"</code>: <span id="swatch-list"></span></figcaption>
  </figure>
</div>
<script type="module">
  const swatched = document.getElementById("swatched");
  swatched.addEventListener("palettechange", () => {
    document.getElementById("swatch-list").replaceChildren(...swatched.palette.map((color) =>
      Object.assign(document.createElement("code"), { textContent: color + " ", style: `background: ${color}; color: white; padding: 0 4px` })));
  });
</script>

<h2>Live</h2>
<p>A camera (or any playing <code>&lt;video&gt;</code>) is redrawn every frame.</p>
<button id="camera">Start camera</button>
<pixel-canvas id="live" width="160" style="inline-size: 320px" effects="adjust(contrast 1.3) palette(gameboy, ordered)">
  <video id="video" muted playsinline aria-label="Your camera, with effects"></video>
</pixel-canvas>
<p>
  <label>Effects: <select id="look">
    <option>adjust(contrast 1.3) palette(gameboy, ordered)</option>
    <option>halftone(4)</option>
    <option>outline(0.12, black, none)</option>
    <option>mosaic(6) palette(pico-8)</option>
    <option>palette(cga) crt()</option>
  </select></label>
</p>

<script type="module">
  document.getElementById("invert-on").onchange = (event) => (document.getElementById("invert").disabled = !event.target.checked);
  document.getElementById("save").onclick = async () => {
    const blob = await document.getElementById("toggled").toBlob();
    const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "pixel.png" });
    link.click();
    URL.revokeObjectURL(link.href);
  };
  document.getElementById("look").onchange = (event) => (document.getElementById("live").effects = event.target.value);
  document.getElementById("camera").onclick = async () => {
    const video = document.getElementById("video");
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
    await video.play();
  };
</script>
</body>
</html>
