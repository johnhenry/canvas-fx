<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pixel-canvas html</title>
<script type="module" src="../global.mjs"></script>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: start; }
  pixel-canvas { inline-size: 300px; }
  .note { padding: 6px 10px; border-radius: 6px; background: #fff3cd; }
  .note[hidden] { display: none; }
  .terminal { background: #111; color: #7CFC00; font: 16px/1.4 ui-monospace, monospace; padding: 14px; margin: 0; }
  .card { background: #e8f0ff; padding: 14px; display: grid; gap: 8px; margin: 0; }
  .card h3 { margin: 0; }
  .card input, .card button { font: inherit; }
  figure { margin: 0; }
  figcaption code { font-size: 12px; }
</style>
</head>
<body>
<p class="note" id="note" hidden>
  This browser doesn't have HTML-in-canvas yet, so the HTML below shows as it
  is. In Chrome, turn on <code>chrome://flags/#canvas-draw-element</code>.
</p>
<div class="row">
  <figure>
    <pixel-canvas html effects="crt()" fps="20">
      <pre class="terminal">&gt; ls games/
forsnaken  pong  tetris
&gt; <span id="typed"></span>_</pre>
    </pixel-canvas>
    <figcaption><code>effects="crt()"</code>: live text, typing itself</figcaption>
  </figure>
  <figure>
    <pixel-canvas id="form" html effects="mosaic(3) palette(gameboy, ordered)">
      <form class="card" onsubmit="event.preventDefault(); this.querySelector('output').value = 'Hello, ' + this.name.value + '!'">
        <h3>Sign the guestbook</h3>
        <label>Name <input name="name" value="Ada"></label>
        <button>Sign</button>
        <output></output>
      </form>
    </pixel-canvas>
    <figcaption><code>mosaic(3) palette(gameboy, ordered)</code>: a real form, still usable</figcaption>
  </figure>
</div>
<p>
  <label>Mosaic size <input type="range" min="1" max="8" value="3" id="size"></label>
</p>
<script type="module">
  const supported = "drawElementImage" in CanvasRenderingContext2D.prototype;
  document.getElementById("note").hidden = supported;
  const typed = document.getElementById("typed");
  const text = "play forsnaken";
  let i = 0;
  setInterval(() => (typed.textContent = text.slice(0, (i = (i + 1) % (text.length + 8)))), 250);
  document.getElementById("size").oninput = (event) =>
    document.getElementById("form").setAttribute("effects", `mosaic(${event.target.value}) palette(gameboy, ordered)`);
</script>
</body>
</html>
